<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nephrotic Syndrome - Authentication</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .auth-container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 420px;
            padding: 40px;
            animation: slideIn 0.4s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .auth-header {
            text-align: center;
            margin-bottom: 30px;
        }

        .auth-header h1 {
            font-size: 28px;
            color: #333;
            margin-bottom: 8px;
            font-weight: 600;
        }

        .auth-header p {
            color: #999;
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: 500;
            font-size: 14px;
        }

        input[type="email"],
        input[type="password"],
        input[type="text"],
        input[type="number"],
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            transition: border-color 0.3s;
            font-family: inherit;
        }

        input[type="email"]:focus,
        input[type="password"]:focus,
        input[type="text"]:focus,
        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .user-type-group {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .checkbox-item {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-item input[type="checkbox"] {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-item label {
            margin-bottom: 0;
            cursor: pointer;
            font-weight: 400;
        }

        .signup-fields {
            display: none;
        }

        .signup-fields.active {
            display: block;
        }

        .signup-fields .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .signup-fields .form-row.full {
            grid-template-columns: 1fr;
        }

        .btn-submit {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            margin-bottom: 15px;
        }

        .btn-submit:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 20px rgba(102, 126, 234, 0.4);
        }

        .btn-submit:active {
            transform: translateY(0);
        }

        .btn-submit:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .toggle-auth {
            text-align: center;
            color: #666;
            font-size: 14px;
        }

        .toggle-auth-link {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
            cursor: pointer;
            transition: color 0.3s;
        }

        .toggle-auth-link:hover {
            color: #764ba2;
        }

        .error-message {
            background-color: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #c33;
        }

        .error-message.active {
            display: block;
            animation: shake 0.3s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }

        .success-message {
            background-color: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
            border-left: 4px solid #3c3;
        }

        .success-message.active {
            display: block;
        }

        .loading {
            display: inline-block;
            width: 14px;
            height: 14px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            margin-right: 8px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        .form-group input::-webkit-outer-spin-button,
        .form-group input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }

        .form-group input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-header">
            <h1 id="authTitle">Sign In</h1>
            <p id="authSubtitle">Welcome back to Nephrotic Syndrome</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form id="authForm" onsubmit="handleSubmit(event)">
            <!-- Sign In / Sign Up Toggle -->
            <div class="form-group">
                <input type="email" id="email" placeholder="Email" required>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder="Password" required>
            </div>

            <!-- Sign Up Only Fields -->
            <div class="signup-fields" id="signupFields">
                <div class="form-group">
                    <label>User Type</label>
                    <div class="user-type-group">
                        <div class="checkbox-item">
                            <input type="radio" id="userTypePatient" name="userType" value="Patient" checked>
                            <label for="userTypePatient">Patient</label>
                        </div>
                        <div class="checkbox-item">
                            <input type="radio" id="userTypeDoctor" name="userType" value="Doctor">
                            <label for="userTypeDoctor">Doctor</label>
                        </div>
                    </div>
                </div>

                <div class="form-group">
                    <input type="text" id="name" placeholder="Full Name">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <input type="number" id="age" placeholder="Age" min="0" max="150">
                    </div>
                    <div class="form-group">
                        <input type="text" id="sex" placeholder="Sex">
                    </div>
                </div>
            </div>

            <button type="submit" class="btn-submit" id="submitBtn">
                <span id="submitBtnText">Sign In</span>
            </button>
        </form>

        <div class="toggle-auth">
            <span id="toggleText">Don't have an account?</span>
            <span class="toggle-auth-link" onclick="toggleAuthMode()">
                <span id="toggleLink">Sign Up</span>
            </span>
        </div>
    </div>

    <!-- Firebase Scripts -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";
        import { getFirestore, collection, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyCWFixNFXCAxvbUBUDlbaXjwoma5331Vsc",
            authDomain: "dipdiary-bd04e.firebaseapp.com",
            projectId: "dipdiary-bd04e",
            storageBucket: "dipdiary-bd04e.firebasestorage.app",
            messagingSenderId: "33819150819",
            appId: "1:33819150819:android:4e9b137fb828596fef38d6"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        // Make functions globally available
        window.toggleAuthMode = toggleAuthMode;
        window.handleSubmit = handleSubmit;
        window.generateDeterministicCode = generateDeterministicCode;

        let isSignUpMode = false;

        function toggleAuthMode() {
            isSignUpMode = !isSignUpMode;
            const signupFields = document.getElementById('signupFields');
            const authTitle = document.getElementById('authTitle');
            const authSubtitle = document.getElementById('authSubtitle');
            const submitBtnText = document.getElementById('submitBtnText');
            const toggleText = document.getElementById('toggleText');
            const toggleLink = document.getElementById('toggleLink');

            if (isSignUpMode) {
                signupFields.classList.add('active');
                authTitle.textContent = 'Create Account';
                authSubtitle.textContent = 'Join Nephrotic Syndrome';
                submitBtnText.textContent = 'Sign Up';
                toggleText.textContent = 'Already have an account?';
                toggleLink.textContent = 'Sign In';
            } else {
                signupFields.classList.remove('active');
                authTitle.textContent = 'Sign In';
                authSubtitle.textContent = 'Welcome back to Nephrotic Syndrome';
                submitBtnText.textContent = 'Sign In';
                toggleText.textContent = "Don't have an account?";
                toggleLink.textContent = 'Sign Up';
            }

            clearMessages();
            resetForm();
        }

        async function handleSubmit(event) {
            event.preventDefault();
            clearMessages();

            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value;
            const submitBtn = document.getElementById('submitBtn');
            const submitBtnText = document.getElementById('submitBtnText');

            // Validate inputs
            if (!email || !password) {
                showError('Please fill in all required fields');
                return;
            }

            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            // Disable button and show loading
            submitBtn.disabled = true;
            const originalText = submitBtnText.textContent;
            submitBtnText.innerHTML = '<span class="loading"></span>Loading...';

            try {
                if (isSignUpMode) {
                    await handleSignUp(email, password);
                } else {
                    await handleSignIn(email, password);
                }
            } catch (error) {
                showError(error.message);
            } finally {
                submitBtn.disabled = false;
                submitBtnText.textContent = originalText;
            }
        }

        async function handleSignIn(email, password) {
            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                showSuccess('Sign in successful! Redirecting...');
                setTimeout(() => {
                    window.location.href = '../dashboard';
                }, 2000);
            } catch (error) {
                let errorMessage = 'Sign in failed';
                if (error.code === 'auth/user-not-found') {
                    errorMessage = 'User not found. Please sign up first.';
                } else if (error.code === 'auth/wrong-password') {
                    errorMessage = 'Invalid email or password.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                }
                throw new Error(errorMessage);
            }
        }

        async function handleSignUp(email, password) {
            const name = document.getElementById('name').value.trim();
            const age = parseInt(document.getElementById('age').value) || 0;
            const sex = document.getElementById('sex').value.trim();
            const userType = document.querySelector('input[name="userType"]:checked').value;

            // Validate signup fields
            if (!name || !age || !sex) {
                throw new Error('Please fill in all required fields');
            }

            if (age < 1 || age > 150) {
                throw new Error('Please enter a valid age');
            }

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                const uid = userCredential.user.uid;

                // Generate deterministic user code
                const userCode = generateDeterministicCode(name, userType);

                // Prepare user data
                const userData = {
                    name: name,
                    age: age,
                    sex: sex,
                    userType: userType,
                    uid: uid,
                    userCode: userCode,
                    createdAt: new Date().toISOString(),
                    email: email
                };

                if (userType === 'Doctor') {
                    userData.pendingRequests = [];
                    userData.approvedPatients = [];
                }

                // Store user data in Firestore
                await setDoc(doc(db, 'UserRegister', uid), userData);

                showSuccess('Account created successfully! Redirecting...');
                setTimeout(() => {
                    window.location.href = '../dashboard';
                }, 2000);
            } catch (error) {
                let errorMessage = 'Sign up failed';
                if (error.code === 'auth/email-already-in-use') {
                    errorMessage = 'Email already in use. Please sign in instead.';
                } else if (error.code === 'auth/weak-password') {
                    errorMessage = 'Password is too weak. Please use a stronger password.';
                } else if (error.code === 'auth/invalid-email') {
                    errorMessage = 'Invalid email address.';
                } else if (error.message) {
                    errorMessage = error.message;
                }
                throw new Error(errorMessage);
            }
        }

        function generateDeterministicCode(name, userType) {
            // Simple hash function for generating a deterministic code
            const input = `${name}${userType}${Date.now()}`;
            let hash = 0;
            for (let i = 0; i < input.length; i++) {
                const char = input.charCodeAt(i);
                hash = ((hash << 5) - hash) + char;
                hash = hash & hash; // Convert to 32bit integer
            }
            const code = Math.abs(hash).toString(36).toUpperCase();
            return code.padStart(10, '0').slice(-10);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('active');
            errorDiv.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }

        function showSuccess(message) {
            const successDiv = document.getElementById('successMessage');
            successDiv.textContent = message;
            successDiv.classList.add('active');
        }

        function clearMessages() {
            document.getElementById('errorMessage').classList.remove('active');
            document.getElementById('successMessage').classList.remove('active');
        }

        function resetForm() {
            document.getElementById('authForm').reset();
        }

        // Check if user is already logged in
        onAuthStateChanged(auth, (user) => {
            if (user) {
                // User is already signed in, redirect to dashboard
                window.location.href = '../dashboard';
            }
        });
    </script>
</body>
</html>
