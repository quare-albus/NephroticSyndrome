<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NephroTrack Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f8fb;color:#122033}nav{height:66px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:5}.brand{font-weight:850;display:flex;gap:9px;align-items:center}.mark{width:34px;height:34px;border-radius:10px;background:#2563eb;color:white;display:grid;place-items:center}.navright{display:flex;gap:12px;align-items:center;color:#64748b;font-size:13px}.logout,.secondary,.close{border:1px solid #e2e8f0;background:white;color:#122033;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}main{width:min(1160px,calc(100% - 30px));margin:30px auto 60px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.eyebrow{font-size:11px;color:#2563eb;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}.head h1{font-size:32px;margin:4px 0}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:white;border:1px solid #e2e8f0;border-radius:17px;box-shadow:0 8px 25px #0f172a08}.card{padding:19px}.label{font-size:12px;color:#64748b}.value{font-size:25px;font-weight:850;margin:9px 0}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionhead h2{font-size:18px;margin:0}.btn{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:13px 15px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}.table th{font-size:11px;color:#64748b;text-transform:uppercase;background:#fafcff}.badge{background:#eff6ff;color:#1d4ed8;padding:5px 8px;border-radius:99px;font-weight:750}.empty{padding:28px;text-align:center;color:#64748b}.people{display:grid;grid-template-columns:1fr 1fr;gap:16px}.person{padding:15px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;gap:10px;align-items:center}.person:last-child{border-bottom:0}.approve,.reject{border:0;border-radius:8px;padding:7px 10px;font-weight:750;cursor:pointer}.approve{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px}.modal{position:fixed;inset:0;background:#0f172a88;display:none;place-items:center;padding:16px;z-index:10}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:9px;font:inherit}.field textarea{min-height:80px}.full{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.people{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column;gap:12px}.navright span{display:none}.formgrid{grid-template-columns:1fr}}
</style></head><body><nav><div class="brand"><span class="mark">N</span>NephroTrack</div><div class="navright"><span id="nav"></span><button class="logout" id="logout">Sign out</button></div></nav><main><div class="head"><div><div class="eyebrow" id="role">Dashboard</div><h1 id="hello">Loading…</h1><div class="muted" id="profile"></div></div><button class="btn" id="primary" style="display:none">＋ Add record</button></div><div id="app"></div></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-app.js";import{getAuth,onAuthStateChanged,signOut}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";import{getFirestore,doc,getDoc,collection,getDocs,query,where,orderBy,limit,addDoc,updateDoc,arrayUnion,arrayRemove,serverTimestamp}from"https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";
const c={apiKey:"AIzaSyCWFixNFXCAxvbUBUDlbaXjwoma5331Vsc",authDomain:"dipdiary-bd04e.firebaseapp.com",projectId:"dipdiary-bd04e",storageBucket:"dipdiary-bd04e.firebasestorage.app",messagingSenderId:"33819150819",appId:"1:33819150819:android:4e9b137fb828596fef38d6"},app=initializeApp(c),auth=getAuth(app),db=getFirestore(app),$=x=>document.getElementById(x);let uid;
function esc(v){return String(v??"-").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}function close(){ $("modal").classList.remove("show")}function open(x){$("modalbox").innerHTML=x;$("modal").classList.add("show")}function rows(rs){if(!rs.length)return'<div class="empty">No records yet.</div>';return'<div class="table"><table><thead><tr><th>Date</th><th>Time</th><th>Urine protein</th><th>Medication</th><th>Symptoms</th></tr></thead><tbody>'+rs.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.time)+'</td><td><span class="badge">'+esc(r.urineProtein)+'</span></td><td>'+esc(r.medication)+'</td><td>'+esc(r.symptoms)+'</td></tr>').join("")+'</tbody></table></div>'}
async function rec(id){let s=await getDocs(query(collection(db,"UserRegister",id,"Records"),orderBy("date","desc"),limit(50)));return s.docs.map(x=>x.data())}
$("logout").onclick=async()=>{await signOut(auth);location.href="{{ site.baseurl }}/"};$("modal").onclick=e=>{if(e.target===$("modal"))close()};
async function patient(p){let rs=await rec(uid),latest=rs[0]||{};$("role").textContent="Patient workspace";$("primary").style.display="block";$("primary").onclick=add;$("app").innerHTML='<div class="grid"><div class="card"><div class="label">Latest urine protein</div><div class="value">'+esc(latest.urineProtein||"—")+'</div><div class="label">'+esc(latest.date||"No record")+'</div></div><div class="card"><div class="label">Latest medication</div><div class="value" style="font-size:18px">'+esc(latest.medication||"—")+'</div></div><div class="card"><div class="label">Records stored</div><div class="value">'+rs.length+'</div></div><div class="card"><div class="label">Your user code</div><div class="value" style="font-size:18px">'+esc(p.userCode||"—")+'</div><div class="label">Give this to your doctor</div></div></div><div class="section"><div class="sectionhead"><h2>Daily records</h2><button class="secondary" id="connect">Connect doctor</button></div><div class="panel">'+rows(rs)+'</div></div>';$("connect").onclick=connect}
function add(){open('<div class="modalhead"><h2>Add daily record</h2><button class="close" id="x">✕</button></div><form id="rf"><div class="formgrid"><div class="field"><label>Date</label><input id="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Time</label><input id="time" type="time" required value="'+new Date().toTimeString().slice(0,5)+'"></div><div class="field"><label>Urine protein</label><input id="protein" required placeholder="e.g. + / ++ / +++"></div><div class="field"><label>Medication</label><input id="med" placeholder="Medication and dosage"></div><div class="field full"><label>Symptoms / notes</label><textarea id="sym"></textarea></div></div><button class="btn">Save record</button></form>');$("x").onclick=close;$("rf").onsubmit=async e=>{e.preventDefault();await addDoc(collection(db,"UserRegister",uid,"Records"),{date:$("date").value,time:$("time").value,urineProtein:$("protein").value.trim(),medication:$("med").value.trim(),symptoms:$("sym").value.trim(),createdAt:serverTimestamp()});close();patient((await getDoc(doc(db,"UserRegister",uid))).data())}}
function connect(){open('<div class="modalhead"><h2>Connect to doctor</h2><button class="close" id="x">✕</button></div><p class="muted">Enter the doctor\'s 10-character user code.</p><form id="df"><div class="field"><label>Doctor code</label><input id="dc" maxlength="10" required></div><button class="btn">Send request</button></form>');$("x").onclick=close;$("df").onsubmit=async e=>{e.preventDefault();let q=await getDocs(query(collection(db,"UserRegister"),where("userCode","==",$("dc").value.trim().toUpperCase()),where("userType","==","Doctor")));if(q.empty){alert("Doctor not found.");return}let d=q.docs[0],x=d.data();if((x.pendingRequests||[]).includes(uid)||(x.approvedPatients||[]).includes(uid)){alert("Request already exists or you are already connected.");return}await updateDoc(doc(db,"UserRegister",d.id),{pendingRequests:arrayUnion(uid)});alert("Connection request sent.");close()}}
async function doctor(p){$("role").textContent="Doctor workspace";let pending=p.pendingRequests||[],approved=p.approvedPatients||[],ph="",ah="";for(let id of pending){let s=await getDoc(doc(db,"UserRegister",id));if(s.exists()){let x=s.data();ph+='<div class="person"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.age)+' years · '+esc(x.sex)+'</div></div><div class="actions"><button class="approve" data-a="'+id+'">Approve</button><button class="reject" data-r="'+id+'">Reject</button></div></div>'}}for(let id of approved){let s=await getDoc(doc(db,"UserRegister",id));if(s.exists()){let x=s.data();ah+='<div class="person"><div><b>'+esc(x.name)+'</b><div class="muted">'+esc(x.age)+' years · '+esc(x.sex)+'</div></div><button class="secondary" data-p="'+id+'">View</button></div>'}}$("app").innerHTML='<div class="grid"><div class="card"><div class="label">Pending requests</div><div class="value">'+pending.length+'</div></div><div class="card"><div class="label">Approved patients</div><div class="value">'+approved.length+'</div></div><div class="card"><div class="label">Doctor code</div><div class="value" style="font-size:18px">'+esc(p.userCode||"—")+'</div></div><div class="card"><div class="label">Account</div><div class="value" style="font-size:18px">Doctor</div></div></div><div class="section people"><div><div class="sectionhead"><h2>Pending requests</h2></div><div class="panel">'+(ph||'<div class="empty">No pending requests.</div>')+'</div></div><div><div class="sectionhead"><h2>Approved patients</h2></div><div class="panel">'+(ah||'<div class="empty">No approved patients.</div>')+'</div></div></div>';document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"UserRegister",uid),{pendingRequests:arrayRemove(b.dataset.a),approvedPatients:arrayUnion(b.dataset.a)});doctor((await getDoc(doc(db,"UserRegister",uid))).data())});document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{await updateDoc(doc(db,"UserRegister",uid),{pendingRequests:arrayRemove(b.dataset.r)});doctor((await getDoc(doc(db,"UserRegister",uid))).data())});document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>view(b.dataset.p))}
async function view(id){let s=await getDoc(doc(db,"UserRegister",id));if(!s.exists())return;let p=s.data(),rs=await rec(id);open('<div class="modalhead"><div><h2>'+esc(p.name)+'</h2><div class="muted">'+esc(p.age)+' years · '+esc(p.sex)+'</div></div><button class="close" id="x">✕</button></div><div class="panel" style="margin-top:15px">'+rows(rs)+'</div>');$("x").onclick=close}
onAuthStateChanged(auth,async u=>{if(!u){location.href="{{ site.baseurl }}/";return}uid=u.uid;let s=await getDoc(doc(db,"UserRegister",uid));if(!s.exists()){location.href="{{ site.baseurl }}/";return}let p=s.data();$("hello").textContent="Hello, "+(p.name||"there");$("nav").textContent=p.email||u.email||"";$("profile").textContent=(p.age||"—")+" years · "+(p.sex||"—")+" · "+(p.userType||"Unknown");if(p.userType==="Doctor")doctor(p);else patient(p)});
</script></body></html>
