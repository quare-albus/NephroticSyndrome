<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>NephroTrack Dashboard</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:#f6f8fb;color:#122033}nav{height:66px;background:white;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;justify-content:space-between;padding:0 4%;position:sticky;top:0;z-index:5}.brand{font-weight:850;display:flex;gap:9px;align-items:center;color:#122033;text-decoration:none;cursor:pointer}.mark{width:34px;height:34px;border-radius:10px;background:#2563eb;color:white;display:grid;place-items:center}.navright{display:flex;gap:12px;align-items:center;color:#64748b;font-size:13px}.logout,.secondary,.close{border:1px solid #e2e8f0;background:white;color:#122033;border-radius:9px;padding:9px 12px;font-weight:700;cursor:pointer}main{width:min(1160px,calc(100% - 30px));margin:30px auto 60px}.head{display:flex;justify-content:space-between;align-items:end;margin-bottom:20px}.eyebrow{font-size:11px;color:#2563eb;font-weight:800;letter-spacing:1.1px;text-transform:uppercase}.head h1{font-size:32px;margin:4px 0}.muted{color:#64748b}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:13px}.card,.panel{background:white;border:1px solid #e2e8f0;border-radius:17px;box-shadow:0 8px 25px #0f172a08}.card{padding:19px}.label{font-size:12px;color:#64748b}.value{font-size:25px;font-weight:850;margin:9px 0}.section{margin-top:20px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.sectionhead h2{font-size:18px;margin:0}.btn{border:0;border-radius:9px;padding:10px 13px;background:#2563eb;color:white;font-weight:800;cursor:pointer}.table{overflow:auto}.table table{width:100%;border-collapse:collapse;min-width:650px}.table th,.table td{padding:13px 15px;border-bottom:1px solid #eef2f7;text-align:left;font-size:13px}.table th{font-size:11px;color:#64748b;text-transform:uppercase;background:#fafcff}.badge{background:#eff6ff;color:#1d4ed8;padding:5px 8px;border-radius:99px;font-weight:750}.empty{padding:28px;text-align:center;color:#64748b}.people{display:grid;grid-template-columns:1fr 1fr;gap:16px}.person{padding:15px;border-bottom:1px solid #eef2f7;display:flex;justify-content:space-between;gap:10px;align-items:center}.person:last-child{border-bottom:0}.approve,.reject{border:0;border-radius:8px;padding:7px 10px;font-weight:750;cursor:pointer}.approve{background:#dcfce7;color:#166534}.reject{background:#fee2e2;color:#991b1b}.actions{display:flex;gap:6px}.modal{position:fixed;inset:0;background:#0f172a88;display:none;place-items:center;padding:16px;z-index:10}.modal.show{display:grid}.modalbox{width:min(760px,100%);max-height:90vh;overflow:auto;background:white;border-radius:18px;padding:22px}.modalhead{display:flex;justify-content:space-between;align-items:center}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin:12px 0}.field label{display:block;font-size:12px;font-weight:750;margin-bottom:6px}.field input,.field textarea{width:100%;padding:11px;border:1px solid #e2e8f0;border-radius:9px;font:inherit}.field textarea{min-height:80px}.full{grid-column:1/-1}@media(max-width:850px){.grid{grid-template-columns:1fr 1fr}.people{grid-template-columns:1fr}}@media(max-width:560px){.grid{grid-template-columns:1fr}.head{align-items:start;flex-direction:column;gap:12px}.navright span{display:none}.formgrid{grid-template-columns:1fr}}
</style></head><body><nav><a class="brand" href="https://quare-albus.github.io/NephroticSyndrome/" aria-label="Go to NephroTrack home" onclick="window.location.href='https://quare-albus.github.io/NephroticSyndrome/';return false;"><span class="mark">N</span>NephroTrack</a><div class="navright"><span id="nav"></span><button class="logout" id="logout">Sign out</button></div></nav><main><div class="head"><div><div class="eyebrow" id="role">Dashboard</div><h1 id="hello">Loading…</h1><div class="muted" id="profile"></div></div><button class="btn" id="primary" style="display:none">＋ Add record</button></div><div id="app"></div></main><div id="modal" class="modal"><div id="modalbox" class="modalbox"></div></div>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";const supabase=createClient("https://nsjnkhcmlnshyjblzolh.supabase.co","sb_publishable_1sXk7LPwOZmgLi-H0DAQOA_f_va5kXA");
const $=x=>document.getElementById(x);let uid,profile;
function esc(v){return String(v??"-").replace(/[&<>"']/g,x=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[x]))}function close(){$("modal").classList.remove("show")}function open(x){$("modalbox").innerHTML=x;$("modal").classList.add("show")}function rows(rs){if(!rs.length)return'<div class="empty">No records yet.</div>';return'<div class="table"><table><thead><tr><th>Date</th><th>Time</th><th>Urine protein</th><th>Medication</th><th>Symptoms</th></tr></thead><tbody>'+rs.map(r=>'<tr><td>'+esc(r.date)+'</td><td>'+esc(r.time)+'</td><td><span class="badge">'+esc(r.urine_protein)+'</span></td><td>'+esc(r.medication)+'</td><td>'+esc(r.symptoms)+'</td></tr>').join("")+'</tbody></table></div>'}
async function rec(id){let{data,error}=await supabase.from("patient_records").select("*").eq("patient_id",id).order("date",{ascending:false}).limit(50);if(error)throw error;return data||[]}
$("logout").onclick=async()=>{await supabase.auth.signOut();location.href="{{ site.baseurl }}/"};$("modal").onclick=e=>{if(e.target===$("modal"))close()};
async function patient(p){let rs=await rec(uid),latest=rs[0]||{};$("role").textContent="Patient workspace";$("primary").style.display="block";$("primary").onclick=add;$("app").innerHTML='<div class="grid"><div class="card"><div class="label">Latest urine protein</div><div class="value">'+esc(latest.urine_protein||"—")+'</div><div class="label">'+esc(latest.date||"No record")+'</div></div><div class="card"><div class="label">Latest medication</div><div class="value" style="font-size:18px">'+esc(latest.medication||"—")+'</div></div><div class="card"><div class="label">Records stored</div><div class="value">'+rs.length+'</div></div><div class="card"><div class="label">Your user code</div><div class="value" style="font-size:18px">'+esc(p.user_code||"—")+'</div><div class="label">Give this to your doctor</div></div></div><div class="section"><div class="sectionhead"><h2>Daily records</h2><button class="secondary" id="connect">Connect doctor</button></div><div class="panel">'+rows(rs)+'</div></div>';$("connect").onclick=connect}
function add(){open('<div class="modalhead"><h2>Add daily record</h2><button class="close" id="x">✕</button></div><form id="rf"><div class="formgrid"><div class="field"><label>Date</label><input id="date" type="date" required value="'+new Date().toISOString().slice(0,10)+'"></div><div class="field"><label>Time</label><input id="time" type="time" required value="'+new Date().toTimeString().slice(0,5)+'"></div><div class="field"><label>Urine protein</label><input id="protein" required placeholder="e.g. + / ++ / +++"></div><div class="field"><label>Medication</label><input id="med" placeholder="Medication and dosage"></div><div class="field full"><label>Symptoms / notes</label><textarea id="sym"></textarea></div></div><button class="btn">Save record</button></form>');$("x").onclick=close;$("rf").onsubmit=async e=>{e.preventDefault();let{error}=await supabase.from("patient_records").insert({patient_id:uid,date:$("date").value,time:$("time").value,urine_protein:$("protein").value.trim(),medication:$("med").value.trim(),symptoms:$("sym").value.trim()});if(error){alert(error.message);return}close();patient(profile)}}
function connect(){open('<div class="modalhead"><h2>Connect to doctor</h2><button class="close" id="x">✕</button></div><p class="muted">Enter the doctor\'s 10-character user code.</p><form id="df"><div class="field"><label>Doctor code</label><input id="dc" maxlength="10" required></div><button class="btn">Send request</button></form>');$("x").onclick=close;$("df").onsubmit=async e=>{e.preventDefault();let{data,error}=await supabase.from("profiles").select("id,name").eq("user_code",$("dc").value.trim().toUpperCase()).eq("user_type","Doctor").maybeSingle();if(error){alert(error.message);return}if(!data){alert("Doctor not found.");return}let{data:existing}=await supabase.from("doctor_requests").select("id,status").eq("patient_id",uid).eq("doctor_id",data.id).maybeSingle();if(existing){alert("Request already exists or you are already connected.");return}let{error:e2}=await supabase.from("doctor_requests").insert({patient_id:uid,doctor_id:data.id,status:"pending"});if(e2)alert(e2.message);else{alert("Connection request sent.");close()}}}
async function doctor(p){$("role").textContent="Doctor workspace";let{data:requests}=await supabase.from("doctor_requests").select("id,patient_id,status,created_at,profiles:patient_id(name,age,sex)").eq("doctor_id",uid).eq("status","pending").order("created_at",{ascending:true});let{data:approved}=await supabase.from("doctor_patients").select("patient_id,profiles:patient_id(name,age,sex)").eq("doctor_id",uid);requests=requests||[];approved=approved||[];let ph=requests.map(r=>'<div class="person"><div><b>'+esc(r.profiles?.name)+'</b><div class="muted">'+esc(r.profiles?.age)+' years · '+esc(r.profiles?.sex)+'</div></div><div class="actions"><button class="approve" data-a="'+r.id+'" data-p="'+r.patient_id+'">Approve</button><button class="reject" data-r="'+r.id+'">Reject</button></div></div>').join("");let ah=approved.map(r=>'<div class="person"><div><b>'+esc(r.profiles?.name)+'</b><div class="muted">'+esc(r.profiles?.age)+' years · '+esc(r.profiles?.sex)+'</div></div><button class="secondary" data-p="'+r.patient_id+'">View</button></div>').join("");$("app").innerHTML='<div class="grid"><div class="card"><div class="label">Pending requests</div><div class="value">'+requests.length+'</div></div><div class="card"><div class="label">Approved patients</div><div class="value">'+approved.length+'</div></div><div class="card"><div class="label">Doctor code</div><div class="value" style="font-size:18px">'+esc(p.user_code||"—")+'</div></div><div class="card"><div class="label">Account</div><div class="value" style="font-size:18px">Doctor</div></div></div><div class="section people"><div><div class="sectionhead"><h2>Pending requests</h2></div><div class="panel">'+(ph||'<div class="empty">No pending requests.</div>')+'</div></div><div><div class="sectionhead"><h2>Approved patients</h2></div><div class="panel">'+(ah||'<div class="empty">No approved patients.</div>')+'</div></div></div>';document.querySelectorAll("[data-a]").forEach(b=>b.onclick=async()=>{let{error}=await supabase.from("doctor_requests").update({status:"approved"}).eq("id",b.dataset.a);if(error){alert(error.message);return}let{error:e2}=await supabase.from("doctor_patients").insert({doctor_id:uid,patient_id:b.dataset.p});if(e2)alert(e2.message);else doctor(p)});document.querySelectorAll("[data-r]").forEach(b=>b.onclick=async()=>{let{error}=await supabase.from("doctor_requests").update({status:"rejected"}).eq("id",b.dataset.r);if(error)alert(error.message);else doctor(p)});document.querySelectorAll("[data-p]").forEach(b=>b.onclick=()=>view(b.dataset.p))}
async function view(id){let{data:p,error}=await supabase.from("profiles").select("name,age,sex").eq("id",id).single();if(error)return alert(error.message);let rs=await rec(id);open('<div class="modalhead"><div><h2>'+esc(p.name)+'</h2><div class="muted">'+esc(p.age)+' years · '+esc(p.sex)+'</div></div><button class="close" id="x">✕</button></div><div class="panel" style="margin-top:15px">'+rows(rs)+'</div>');$("x").onclick=close}
const{data:{session}}=await supabase.auth.getSession();if(!session){location.href="{{ site.baseurl }}/"}else{uid=session.user.id;let{data:p,error}=await supabase.from("profiles").select("*").eq("id",uid).single();if(error||!p){location.href="{{ site.baseurl }}/"}else{profile=p;$("hello").textContent="Hello, "+(p.name||"there");$("nav").textContent=session.user.email||"";$("profile").textContent=(p.age||"—")+" years · "+(p.sex||"—")+" · "+(p.user_type||"Unknown");if(p.user_type==="Doctor")doctor(p);else patient(p)}}</script></body></html>
